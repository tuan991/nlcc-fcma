[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpilot-ai-optimizer"
version = "0.4.0"
description = "Local-first super-saver prompt, JSON, and code-context optimizer exposed over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PromptPilot contributors"}]
dependencies = ["mcp>=1.2.0,<2.0.0"]

[project.scripts]
promptpilot-mcp = "promptpilot.server:main"

[tool.setuptools.packages.find]
include = ["promptpilot*"]
